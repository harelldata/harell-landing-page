<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to Harell</title>
    <link rel="canonical" href="https://app.harelldata.com/" />
    <meta http-equiv="refresh" content="0; url=https://app.harelldata.com/" />
    <script>
      const target = new URL("https://app.harelldata.com/");
      target.pathname = window.location.pathname;
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://app.harelldata.com/">app.harelldata.com</a>...</p>
  </body>
</html>
